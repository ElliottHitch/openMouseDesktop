name: Build (Windows)

# Builds the native GPUI app (gpui/) and its installer on Windows, runs the
# tests, and uploads the installer so any push can be downloaded and tried.
# Runs on every push to main and gpui, on pull requests, and by hand from the
# Actions tab. Tagged releases are published by release.yml.
on:
  workflow_dispatch:
  push:
    branches: [main, gpui]
  pull_request:

# A newer push to the same branch or PR makes an unfinished build of the older
# one pointless, so cancel it instead of letting them pile up. Never on main:
# those builds are the ones that fill the shared cache, and a cancelled run
# saves nothing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # The installer is its own cargo workspace with its own target folder,
      # so it needs its own cache entry. `shared-key` lets release.yml reuse
      # what this builds.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gpui
            gpui/installer
          shared-key: windows

      # gpui/build.rs bundles the protocol drivers with esbuild, so the root
      # node_modules must exist first.
      - name: Install JS dependencies
        run: npm ci

      - name: Test
        run: cargo test
        working-directory: gpui

      - name: Build release binary
        run: cargo build --release
        working-directory: gpui

      # Needs the app's release .exe to exist first: its build.rs embeds
      # those bytes as the installer's payload (see gpui/installer/build.rs).
      - name: Build installer
        run: cargo build --release
        working-directory: gpui/installer

      - name: Rename installer artifact
        run: cp gpui/installer/target/release/openmouse-installer.exe OpenMouseDesktopSetup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: openmouse-windows
          path: OpenMouseDesktopSetup.exe
          if-no-files-found: error
