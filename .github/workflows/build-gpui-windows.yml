name: Build (Windows)

# Builds the native GPUI app (gpui/) and its installer on Windows, runs the
# tests, and uploads the installer so any push can be downloaded and tried.
# Runs on every push to main and gpui, on pull requests, and by hand from the
# Actions tab. Tagged releases are published by release.yml.
on:
  workflow_dispatch:
  push:
    branches: [main, gpui]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui

      # gpui/build.rs bundles the protocol drivers with esbuild, so the root
      # node_modules must exist first.
      - name: Install JS dependencies
        run: npm ci

      - name: Test
        run: cargo test
        working-directory: gpui

      - name: Build release binary
        run: cargo build --release
        working-directory: gpui

      # Needs the app's release .exe to exist first: its build.rs embeds
      # those bytes as the installer's payload (see gpui/installer/build.rs).
      - name: Build installer
        run: cargo build --release
        working-directory: gpui/installer

      - name: Rename installer artifact
        run: cp gpui/installer/target/release/openmouse-installer.exe OpenMouseDesktopSetup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: openmouse-windows
          path: OpenMouseDesktopSetup.exe
          if-no-files-found: error
